<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #191724;
        --bg-3: #26233a;
        --ink: #e0def4;
        --ink-2: #908caa;
        --accent: #eb6f92;
        --accent-2: #f6c177;
        --display: 'Fira Mono', ui-monospace, monospace;
        --body: 'Inter', system-ui, sans-serif;
        --track-label: 0.08em;
        --track-display: -0.04em;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: var(--bg);
      }
      .canvas {
        position: relative;
        overflow: hidden;
        width: 1200px;
        height: 630px;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 64px 72px;
        font-family: var(--body);
        --a1: var(--accent);
        --a2: var(--accent-2);
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 12px;
        background: var(--acc, var(--accent));
      }
      .top,
      .bot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }
      .top {
        padding-bottom: 20px;
        border-bottom: 2px solid var(--bg-3);
      }
      .bot {
        padding-top: 20px;
        border-top: 2px solid var(--bg-3);
      }
      .mid {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 40px;
        align-items: end;
        align-self: center;
      }
      .mid.nonum {
        grid-template-columns: 1fr;
      }
      .no {
        font: 500 168px/0.8 var(--display);
        letter-spacing: -0.06em;
        color: var(--acc, var(--accent));
        font-variant-numeric: tabular-nums;
      }
      .lbl {
        font: 500 var(--lbl, 22px)/1.2 var(--display);
        letter-spacing: var(--track-label);
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .lbl b {
        font-weight: 500;
        color: var(--acc, var(--accent));
      }
      .ttl {
        font-family: var(--display);
        font-weight: 500;
        letter-spacing: var(--track-display);
        line-height: 1.04;
        font-size: var(--ts, 64px);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
        text-wrap: balance;
      }
      .sub {
        font-size: 26px;
        line-height: 1.4;
        color: var(--ink-2);
        margin-top: 18px;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .mk {
        display: block;
        width: 72px;
        height: auto;
        aspect-ratio: 770/390;
        color: var(--ink);
      }
      .word {
        font: 500 26px/1 var(--display);
        letter-spacing: var(--track-display);
      }
      .word span {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="m" viewBox="-375 -215 770 390">
        <g fill="none" stroke-linecap="round">
          <path
            stroke="currentColor"
            stroke-width="30"
            d="M-350 0A155 155 0 0 1-71.9-94L71.9 94A155 155 0 1 0 71.9-94L-71.9 94"
          />
          <path
            style="stroke: var(--a1, currentColor)"
            stroke-width="22"
            d="M-142.5 90.9A105 105 0 0 1-285.9 52.5"
          />
          <path
            style="stroke: var(--a2, currentColor)"
            stroke-width="22"
            d="M124.9-192.6A205 205 0 0 1 372.5-102.5"
          />
        </g>
      </symbol>
    </svg>
    <div class="canvas" id="c">
      <span class="bar"></span>
      <div class="top"><span class="lbl" id="tl"></span><span class="lbl" id="tr"></span></div>
      <div class="mid" id="mid">
        <span class="no" id="no"></span>
        <div>
          <h1 class="ttl" id="ttl"></h1>
          <p class="sub" id="sub"></p>
        </div>
      </div>
      <div class="bot">
        <div class="brand">
          <svg class="mk"><use href="#m" /></svg
          ><span class="word">techquests<span>.</span>dev</span>
        </div>
        <span class="lbl" id="br"></span>
      </div>
    </div>
    <script>
      window.render = (d) => {
        const c = document.getElementById('c');
        const tl = document.getElementById('tl');
        const tr = document.getElementById('tr');
        const no = document.getElementById('no');
        const mid = document.getElementById('mid');
        const ttl = document.getElementById('ttl');
        const sub = document.getElementById('sub');
        const br = document.getElementById('br');
        c.style.removeProperty('--acc');
        c.style.removeProperty('--ts');
        br.style.removeProperty('--lbl');
        no.style.display = '';
        mid.classList.remove('nonum');

        if (d.accent) c.style.setProperty('--acc', d.accent);
        if (d.titleSize) c.style.setProperty('--ts', `${d.titleSize}px`);

        tl.textContent = d.topLeftLabel;
        if (d.topLeftEm) {
          const em = document.createElement('b');
          em.textContent = d.topLeftEm;
          tl.appendChild(em);
        }
        tr.textContent = d.topRight;

        if (d.number) {
          no.textContent = d.number;
        } else {
          no.style.display = 'none';
          mid.classList.add('nonum');
        }

        ttl.textContent = d.title;
        sub.textContent = d.sub || '';
        sub.style.display = d.sub ? '' : 'none';

        br.textContent = d.bottomRight;
        if (d.bottomRightSmall) br.style.setProperty('--lbl', '18px');
      };
    </script>
  </body>
</html>
