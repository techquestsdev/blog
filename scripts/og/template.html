<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: hsl(220, 10%, 8%);
    --bg-2: hsl(220, 10%, 11%);
    --bg-3: hsl(220, 10%, 16%);
    --txt: hsl(220, 30%, 80%);
    --txt-0: hsl(220, 45%, 90%);
    --txt-2: hsl(220, 11%, 60%);
    --txt-3: hsl(220, 11%, 35%);
    --green: hsl(189, 41%, 68%);
    --yellow: hsl(34, 85%, 67%);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* faint ASCII map texture */
  .field {
    position: absolute;
    inset: 0;
    font-family: 'Fira Mono', monospace;
    font-size: 26px;
    line-height: 30px;
    letter-spacing: 6px;
    color: var(--green);
    opacity: 0.06;
    white-space: pre-wrap;
    word-break: break-all;
    padding: 10px;
    user-select: none;
  }
  .frame {
    position: absolute;
    inset: 40px;
    border: 1px solid var(--bg-3);
    border-radius: 14px;
  }
  .corner {
    position: absolute;
    color: var(--green);
    font-family: 'Fira Mono', monospace;
    font-size: 22px;
  }
  .c-tl { top: 30px; left: 30px; }
  .c-br { bottom: 30px; right: 30px; color: var(--txt-3); }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
    z-index: 2;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .brand svg { width: 150px; height: auto; }
  .wordmark {
    font-family: 'Fira Mono', monospace;
    /* 500 to match $font-weight-display — bold overpowers the thin loop mark. */
    font-weight: 500;
    /* Mono is wide — smaller size and negative tracking keep the wordmark on one
       comfortable line next to the mark. Mirrors $letter-spacing-display. */
    font-size: 86px;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--txt-0);
  }
  .wordmark .dev { color: var(--green); }
  .tagline {
    font-family: 'Fira Mono', monospace;
    font-size: 34px;
    color: var(--txt-2);
    margin-top: 40px;
  }
  .tagline .dash { color: var(--yellow); }
  .meta {
    position: absolute;
    left: 96px;
    bottom: 70px;
    font-family: 'Fira Mono', monospace;
    font-size: 26px;
    color: var(--txt-3);
    letter-spacing: 1px;
  }
  .meta .sep { color: var(--bg-3); }
  .url {
    position: absolute;
    right: 96px;
    bottom: 70px;
    font-family: 'Fira Mono', monospace;
    font-size: 26px;
    color: var(--green);
  }
</style>
</head>
<body>
  <div class="field" id="field"></div>
  <div class="frame"></div>
  <div class="corner c-tl">❖</div>
  <div class="corner c-br">◈</div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg">
        <g stroke-miterlimit="10" fill="none" stroke-linecap="round">
          <path
            stroke="var(--txt-0)"
            stroke-width="30"
            d="M-343.843 6.862A153 153 0 0 1-344 0c-.052-94.424 85.51-159.133 155-160 56.718-.708 105.182 35.999 128.422 70.38C0 0-8.304 23.34 60.366 90.809 90.524 120.44 138.796 155.991 195 155c77.203-1.361 148-75.502 148-155 0-88.638-68.375-153.52-146-160-39.464-3.295-118-.604-197 160-16.674 33.896-33.129 60.481-49.075 81.338"
            transform="translate(400 206)"
          />
          <path
            stroke="var(--green)"
            stroke-width="20"
            d="M-193.997 123.007c-20.015 4.767-37.545 2.732-52.218 1.222-15.169-1.561-31.594-7.935-46.919-18.187"
            transform="translate(441.756 211.719)"
          />
          <path
            stroke="var(--yellow)"
            stroke-width="20"
            d="M131.322-193.41c14.443-2.1 27.151-2.02 37.843-1.981 41.795.153 90.727 22.932 127.642 61.101"
            transform="translate(441.756 211.719)"
          />
        </g>
      </svg>
      <div class="wordmark">techquests<span class="dev">.dev</span></div>
    </div>
    <div class="tagline">
      An SRE's field notes <span class="dash">—</span> homelabs, platforms, and code.
    </div>
  </div>

  <div class="meta">Quests <span class="sep">·</span> Chronicles <span class="sep">·</span> Sagas</div>
  <div class="url">techquests.dev</div>

  <script>
    // Fill the faint background with deterministic ASCII "map" characters.
    const cols = 80;
    const rows = 22;
    let out = '';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const n = Math.abs(Math.sin(x * 0.35 + y * 0.6) + Math.sin((x + y) * 0.2));
        out += n > 1.3 ? '+' : n > 0.8 ? ':' : n > 0.45 ? '.' : ' ';
      }
      out += '\n';
    }
    document.getElementById('field').textContent = out;
  </script>
</body>
</html>
