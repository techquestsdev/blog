<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191724" media="(prefers-color-scheme: dark)" />
    <script>
      document.documentElement.setAttribute(
        'color-scheme',
        window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      );
    </script>
    <script defer src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script
      defer
      src="https://analytics.techquests.dev/umami"
      data-website-id="c8dd6e51-7182-472b-9637-01955cdec219"
      data-auto-track="false"
    ></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
